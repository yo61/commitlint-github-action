name: Commit Linter
description: Lints Pull Request commit messages with commitlint
author: Wagner Santos
inputs:
  configFile:
    description:
      Commitlint config file. If the file doesn't exist, config-conventional settings will be
      loaded as a fallback.
    default: ./commitlint.config.mjs
    required: false
  failOnWarnings:
    description: Whether you want to fail on warnings or not
    default: 'false'
    required: false
  failOnErrors:
    description: Whether you want to fail on errors or not
    default: 'true'
    required: true
  helpURL:
    description: Link to a page explaining your commit message convention
    default: https://github.com/conventional-changelog/commitlint/#what-is-commitlint
    required: false
  commitDepth:
    description: When set to a valid Integer value - X, considers only the latest X number of commits.
    default: ''
    required: false
  token:
    description: >
      Personal access token (PAT) used to interact with the GitHub API. By default, the automatic
      token provided by GitHub is used. You can see more info about GitHub's default token here:
      https://docs.github.com/en/actions/configuring-and-managing-workflows/authenticating-with-the-github_token
    default: ${{ github.token }}
    required: false
outputs:
  results:
    description: The error and warning messages for each one of the analyzed commits
runs:
  using: docker
  # Pinned by digest, not tag: a tag is mutable, so pinning this action by
  # commit SHA downstream would still leave the image swappable. The release
  # workflow sets it on each release PR.
  image: docker://ghcr.io/yo61/commitlint-github-action@sha256:1d5d649ab901e341f940d7317175a11d57871b5fbefa0cfca382918b619a7d0b
branding:
  icon: check-square
  color: blue
