name: Release

# How releases pin the image: decisions/2026-11-11-release-please-pins-image-on-release-pr.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/commitlint-github-action
  PLATFORMS: linux/amd64 linux/arm64

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.create_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pin-prepare:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - id: pr
        name: Find the open release PR
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' --json number,headRefName)
          case $(jq length <<< "$prs") in
            0)
              echo "no open release PR; nothing to pin"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            1) ;;
            *)
              echo "::error::expected at most one open 'autorelease: pending' PR, found: $prs"
              exit 1
              ;;
          esac
          echo "number=$(jq -r '.[0].number' <<< "$prs")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.[0].headRefName' <<< "$prs")" >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.pr.outputs.skip != 'true'
        name: Bring the release PR up to date with main
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BRANCH"
          if git merge-base --is-ancestor origin/main "origin/$BRANCH"; then
            echo "$BRANCH already contains main"
          else
            gh api -X PUT "repos/$REPO/pulls/$NUMBER/update-branch" > /dev/null
            for _ in $(seq 30); do
              git fetch -q origin "$BRANCH"
              git merge-base --is-ancestor origin/main "origin/$BRANCH" && break
              sleep 2
            done
            if ! git merge-base --is-ancestor origin/main "origin/$BRANCH"; then
              echo "::error::$BRANCH still does not contain main a minute after update-branch"
              exit 1
            fi
          fi
          git checkout -q --detach "origin/$BRANCH"

      - if: steps.pr.outputs.skip != 'true'
        id: check
        name: Skip if the branch already ends in a pin commit
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == "chore(release): pin image digest"* ]]; then
            echo "branch already ends in a pin commit; nothing to do"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pin-build:
    needs: pin-prepare
    if: needs.pin-prepare.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin-prepare.outputs.sha }}
          persist-credentials: false

      - name: Build and push the ${{ matrix.arch }} image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ needs.pin-prepare.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --provenance=false --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:release-pr-$ARCH" .
          docker push "$IMAGE:release-pr-$ARCH"

  pin-commit:
    needs: [pin-prepare, pin-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.pin-prepare.outputs.sha }}
    steps:
      - name: Merge the per-arch images into one index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          sources=()
          for platform in $PLATFORMS; do
            ref="$IMAGE:release-pr-${platform#linux/}"
            revision=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' \
              | jq -r '.config.Labels["org.opencontainers.image.revision"]')
            if [[ "$revision" != "$SHA" ]]; then
              echo "::error::$ref was built from '$revision', not $SHA"
              exit 1
            fi
            sources+=("$IMAGE@$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)")
          done
          docker buildx imagetools create -t "$IMAGE:release-pr" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:release-pr" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "pushed $IMAGE@$digest from ${sources[*]}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin-prepare.outputs.sha }}
          persist-credentials: false

      - id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # API commits are signed by the App, as the required_signatures rule on main demands.
      - name: Commit the digest to action.yml
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.pin-prepare.outputs.branch }}
        run: |
          set -euo pipefail
          sed -E -i "s|^(  image: docker://$IMAGE@)sha256:[0-9a-f]{64}\$|\1$DIGEST|" action.yml
          if ! grep -qF "image: docker://$IMAGE@$DIGEST" action.yml; then
            echo "::error::action.yml has no 'image: docker://$IMAGE@sha256:...' line to update"
            exit 1
          fi
          # shellcheck disable=SC2016 # GraphQL variables, not shell expansions.
          query='mutation($repo: String!, $branch: String!, $sha: GitObjectID!, $headline: String!, $content: Base64String!) {
            createCommitOnBranch(input: {
              branch: { repositoryNameWithOwner: $repo, branchName: $branch },
              message: { headline: $headline },
              expectedHeadOid: $sha,
              fileChanges: { additions: [{ path: "action.yml", contents: $content }] }
            }) { commit { url } }
          }'
          jq -n \
            --arg query "$query" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --arg headline "chore(release): pin image digest ${DIGEST:7:12}" \
            --arg content "$(base64 -w0 < action.yml)" \
            '{query: $query, variables: {repo: $repo, branch: $branch, sha: $sha, headline: $headline, content: $content}}' \
            > "$RUNNER_TEMP/graphql.json"
          gh api graphql --input "$RUNNER_TEMP/graphql.json"

  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.release-please.outputs.sha }}
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: digest
        name: Read the digest the release pins
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^ HEAD -- action.yml; then
            echo "::error::Release commit $SHA does not change action.yml, so it still pins the previous release's image. Nothing was tagged; release a patch once pin-commit has committed to the release PR."
            exit 1
          fi
          image=$(yq '.runs.image' action.yml)
          digest=${image#"docker://$IMAGE@"}
          if [[ "$digest" == "$image" || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::action.yml runs.image is '$image', expected docker://$IMAGE@sha256:<digest>"
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check this runner's image was built from the released source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker pull -q "$IMAGE@$DIGEST" > /dev/null
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$DIGEST")
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$IMAGE@$DIGEST has no org.opencontainers.image.revision label for $(uname -m), so its source cannot be checked. Nothing was tagged."
            exit 1
          fi
          git fetch -q origin "$revision"
          if ! git diff --quiet "$revision" "$SHA" -- . ':(exclude)action.yml'; then
            echo "::error::$IMAGE@$DIGEST ($(uname -m)) was built from $revision, which differs from release commit $SHA outside action.yml:"
            git diff --stat "$revision" "$SHA" -- . ':(exclude)action.yml'
            echo "::error::Nothing was tagged. Release a patch once pin-commit has repinned the release PR."
            exit 1
          fi
          echo "$IMAGE@$DIGEST ($(uname -m)) was built from $revision, the released source"

      - name: Smoke test the pinned image
        run: |
          set -euo pipefail
          echo "pinned image runs node $(docker run --rm --entrypoint node "$IMAGE@$DIGEST" --version) on $(uname -m)"
          docker run --rm --entrypoint node "$IMAGE@$DIGEST" \
            -e 'console.log("commitlint " + require("/node_modules/@commitlint/lint/package.json").version)'

  publish:
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      MAJOR: ${{ needs.release-please.outputs.major }}
      SHA: ${{ needs.release-please.outputs.sha }}
      DIGEST: ${{ needs.verify.outputs.digest }}
    steps:
      - name: Tag the pinned image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          platforms=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')
          if [[ "$platforms" != "$PLATFORMS" ]]; then
            echo "::error::$IMAGE@$DIGEST holds '$platforms', expected '$PLATFORMS'. Nothing was tagged."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$MAJOR" "$IMAGE@$DIGEST"
          for tag in "$VERSION" "$MAJOR"; do
            published=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [[ "$published" != "$DIGEST" ]]; then
              echo "::error::$IMAGE:$tag is $published, but action.yml pins $DIGEST"
              exit 1
            fi
          done
          echo "tagged $IMAGE@$DIGEST ($platforms) as $VERSION and $MAJOR"

      - id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Move the major version tag
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$MAJOR"
          if gh api "repos/$REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f "sha=$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" > /dev/null
          fi
          echo "::notice::$tag now points at $SHA"
